  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <text x="50%" y="50%" font-family="Arial, sans-serif" font-size="64" fill="rgba(255,255,255,0.1)" text-anchor="middle" dominant-baseline="middle">
